# helm/values.yaml — default configuration (no secrets hardcoded)

# ─────────────────────────────────────────────────────────────
# FastAPI Application
# ─────────────────────────────────────────────────────────────
image:
  repository: yourdockerhubuser/ecommerce-agent
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Liveness/readiness probes (uses /health endpoint)
probes:
  liveness:
    path: /health
    initialDelaySeconds: 60
    periodSeconds: 30
    failureThreshold: 5
  readiness:
    path: /health
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 12

ingress:
  enabled: false
  className: nginx
  host: ecommerce.local
  tls: false

# ─────────────────────────────────────────────────────────────
# PostgreSQL
# ─────────────────────────────────────────────────────────────
postgres:
  enabled: true
  image: postgres:17-alpine
  database: ecommerce_db
  user: ecommerce_user
  # password is provided via Kubernetes Secret (not here)
  port: 5432
  storage: 5Gi
  storageClass: ""

# ─────────────────────────────────────────────────────────────
# LangFuse (self-hosted)
# ─────────────────────────────────────────────────────────────
langfuse:
  enabled: true
  image: langfuse/langfuse:3
  port: 3000
  nextauthUrl: http://localhost:3000
  telemetry: false

langfuseWorker:
  image: langfuse/langfuse-worker:3

langfuseDb:
  image: postgres:15-alpine
  database: langfuse
  user: langfuse
  storage: 2Gi

clickhouse:
  image: clickhouse/clickhouse-server:24.8
  storage: 5Gi

redis:
  image: redis:7-alpine

minio:
  image: minio/minio:latest
  storage: 5Gi

# ─────────────────────────────────────────────────────────────
# Monitoring (Prometheus + Grafana)
# ─────────────────────────────────────────────────────────────
prometheus:
  enabled: true
  image: prom/prometheus:latest
  port: 9090
  storage: 2Gi

grafana:
  enabled: true
  image: grafana/grafana:latest
  port: 3000
  servicePort: 3001
  storage: 1Gi

# ─────────────────────────────────────────────────────────────
# Application settings (non-secret)
# ─────────────────────────────────────────────────────────────
app:
  environment: production
  logLevel: INFO
  sessionExpiryMinutes: 30
  historyWindowSize: 10
  intentConfidenceThreshold: 0.7
  llmModel: llama-3.3-70b-versatile

# Reference to the Kubernetes Secret created outside Helm
# (populated by CI/CD via kubectl create secret)
secretName: ecommerce-secrets
