apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
data:
  ENVIRONMENT:                  {{ .Values.app.environment | quote }}
  LOG_LEVEL:                    {{ .Values.app.logLevel | quote }}
  SESSION_EXPIRY_MINUTES:       {{ .Values.app.sessionExpiryMinutes | quote }}
  HISTORY_WINDOW_SIZE:          {{ .Values.app.historyWindowSize | quote }}
  INTENT_CONFIDENCE_THRESHOLD:  {{ .Values.app.intentConfidenceThreshold | quote }}
  LLM_MODEL_NAME:               {{ .Values.app.llmModel | quote }}
  APP_HOST:                     "0.0.0.0"
  APP_PORT:                     "8000"
  LANGFUSE_HOST:                "http://{{ .Release.Name }}-langfuse:{{ .Values.langfuse.port }}"

---
{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-prometheus-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: 'fastapi'
        static_configs:
          - targets: ['{{ .Release.Name }}-fastapi:{{ .Values.service.targetPort }}']
        metrics_path: '/metrics'
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:{{ .Values.prometheus.port }}']
{{- end }}
