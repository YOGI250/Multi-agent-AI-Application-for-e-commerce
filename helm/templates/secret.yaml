{{/*
This template documents the shape of the external secret but does NOT
hardcode values. The actual secret is created by the CI/CD pipeline via:

  kubectl create secret generic ecommerce-secrets \
    --from-literal=groq-api-key="..." \
    ...

The Deployment references keys from this secret by name.
This file is kept here so `helm template` and `helm lint` can validate
the full chart without requiring the secret to already exist.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
# Keys must be populated externally — not hardcoded here.
# Expected keys:
#   groq-api-key
#   database-url        (optional — can use configmap DATABASE_URL with secret injection)
#   langfuse-secret-key
#   langfuse-public-key
#   langfuse-nextauth-secret
#   langfuse-salt
#   langfuse-encryption-key
#   google-client-id
#   google-client-secret
#   postgres-password
