apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-fastapi
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
    component: fastapi
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ecommerce.selectorLabels" . | nindent 4 }}
    component: fastapi
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}

---
{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
    component: postgres
spec:
  type: ClusterIP
  selector:
    {{- include "ecommerce.selectorLabels" . | nindent 4 }}
    component: postgres
  ports:
    - name: postgres
      protocol: TCP
      port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.port }}
{{- end }}

---
{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
    component: prometheus
spec:
  type: ClusterIP
  selector:
    {{- include "ecommerce.selectorLabels" . | nindent 4 }}
    component: prometheus
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.prometheus.port }}
      targetPort: {{ .Values.prometheus.port }}
{{- end }}

---
{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
    component: grafana
spec:
  type: ClusterIP
  selector:
    {{- include "ecommerce.selectorLabels" . | nindent 4 }}
    component: grafana
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.grafana.servicePort }}
      targetPort: {{ .Values.grafana.port }}
{{- end }}

---
{{- if .Values.langfuse.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-langfuse
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
    component: langfuse
spec:
  type: ClusterIP
  selector:
    {{- include "ecommerce.selectorLabels" . | nindent 4 }}
    component: langfuse
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.langfuse.port }}
      targetPort: {{ .Values.langfuse.port }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-langfuse-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
    component: langfuse-db
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "ecommerce.selectorLabels" . | nindent 4 }}
    component: langfuse-db
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
{{- end }}
