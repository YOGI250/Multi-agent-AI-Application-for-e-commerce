{{- if .Values.grafana.enabled }}
# ─────────────────────────────────────────────────────────────
# Grafana — datasources (Prometheus + Loki)
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana-datasources
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://{{ .Release.Name }}-prometheus:{{ .Values.prometheus.port }}
        isDefault: true
        editable: false
      - name: Loki
        type: loki
        uid: P8E80F9AEF21F6940
        access: proxy
        url: http://loki:3100
        editable: false

---
# ─────────────────────────────────────────────────────────────
# Grafana — E-Commerce AI dashboard
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        type: file
        options:
          path: /var/lib/grafana/dashboards
  ecommerce-dashboard.json: |
    {
      "title": "E-Commerce AI Support Dashboard",
      "uid": "ecommerce-ai",
      "schemaVersion": 36,
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "title": "Request Volume Over Time",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [{
            "expr": "rate(chat_requests_total[1m])",
            "legendFormat": "{{ `{{agent_used}}` }} - {{ `{{status}}` }}"
          }]
        },
        {
          "id": 2,
          "title": "Agent Selection Distribution",
          "type": "piechart",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [{
            "expr": "sum by (agent_used) (chat_requests_total)",
            "legendFormat": "{{ `{{agent_used}}` }}"
          }]
        },
        {
          "id": 3,
          "title": "Average Latency Per Agent (seconds)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [{
            "expr": "rate(chat_request_latency_seconds_sum[5m]) / rate(chat_request_latency_seconds_count[5m])",
            "legendFormat": "{{ `{{agent_used}}` }}"
          }]
        },
        {
          "id": 4,
          "title": "Error Rate (per second)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "targets": [{
            "expr": "rate(chat_errors_total[5m])",
            "legendFormat": "{{ `{{error_type}}` }} / {{ `{{agent_used}}` }}"
          }]
        },
        {
          "id": 5,
          "title": "LLM Token Consumption Over Time",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 8 },
          "targets": [{
            "expr": "rate(llm_tokens_total[5m])",
            "legendFormat": "{{ `{{agent_used}}` }} - {{ `{{token_type}}` }}"
          }]
        },
        {
          "id": 6,
          "title": "Application Logs",
          "type": "logs",
          "gridPos": { "x": 0, "y": 24, "w": 24, "h": 10 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [{
            "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
            "expr": "{namespace=\"ecommerce\", container=\"fastapi\"}",
            "legendFormat": ""
          }],
          "options": {
            "showTime": true,
            "showLabels": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          }
        }
      ]
    }
{{- end }}
