            - name: DATABASE_URL
              value: "postgresql://{{ .Values.langfuseDb.user }}:$(LANGFUSE_DB_PASSWORD)@{{ .Release.Name }}-langfuse-db:5432/{{ .Values.langfuseDb.database }}"
            - name: CLICKHOUSE_MIGRATION_URL
              value: "clickhouse://langfuse:$(LANGFUSE_DB_PASSWORD)@{{ .Release.Name }}-langfuse-clickhouse:9000/langfuse"
            - name: CLICKHOUSE_URL
