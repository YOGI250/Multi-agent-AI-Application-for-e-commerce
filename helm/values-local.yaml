# helm/values-local.yaml — lightweight config for local kind deployment
# Disables heavy services (Langfuse, Prometheus, Grafana) to save RAM

image:
  repository: ecommerce-agent
  tag: latest
  pullPolicy: Never

postgres:
  enabled: true
  storage: 1Gi

langfuse:
  enabled: false
  host: "https://cloud.langfuse.com"

prometheus:
  enabled: false

grafana:
  enabled: false
