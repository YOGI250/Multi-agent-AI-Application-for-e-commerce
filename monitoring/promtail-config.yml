# monitoring/promtail-config.yml

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: fastapi
    static_configs:
      - targets:
          - localhost
        labels:
          job: ecommerce-app
          __path__: /logs/*.log
    pipeline_stages:
      - json:
          expressions:
            level:      levelname
            logger:     name
            message:    message
            agent_used: agent_used
            session_id: session_id
            request_id: request_id
      - labels:
          level:
          logger:
          agent_used:
          session_id:
          request_id: