# docker-compose.yml

services:

  # ==========================================
  # FastAPI Application
  # ==========================================
  fastapi:
    build: .
    container_name: ecommerce-fastapi
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - LANGFUSE_HOST=http://langfuse-server:3000
    volumes:
      - ./logs:/app/logs
    depends_on:
      - postgres
    networks:
      - ecommerce-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:17-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # LangFuse — self-hosted observability (v3)
  # v3 requires ClickHouse + Redis + langfuse-worker
  # ==========================================
  langfuse-server:
    image: langfuse/langfuse:3
    container_name: langfuse-server
    depends_on:
      - langfuse-db
      - clickhouse
      - redis
      - minio
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL:                           postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET:                        ${LANGFUSE_NEXTAUTH_SECRET}
      SALT:                                   ${LANGFUSE_SALT}
      ENCRYPTION_KEY:                         ${LANGFUSE_ENCRYPTION_KEY}
      NEXTAUTH_URL:                           http://localhost:3000
      TELEMETRY_ENABLED:                      "false"
      CLICKHOUSE_MIGRATION_URL:               clickhouse://langfuse:langfuse@clickhouse:9000/langfuse
      CLICKHOUSE_URL:                         http://clickhouse:8123
      CLICKHOUSE_USER:                        langfuse
      CLICKHOUSE_PASSWORD:                    langfuse
      REDIS_HOST:                             redis
      REDIS_PORT:                             "6379"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET:        langfuse
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniopassword
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT:      http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_REGION:        us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET:        langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniopassword
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT:      http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_REGION:        us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_LOG_LEVEL:                     info
    networks:
      - ecommerce-network
    restart: unless-stopped

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: langfuse-worker
    depends_on:
      - langfuse-db
      - clickhouse
      - redis
      - minio
    environment:
      DATABASE_URL:                           postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      SALT:                                   ${LANGFUSE_SALT}
      ENCRYPTION_KEY:                         ${LANGFUSE_ENCRYPTION_KEY}
      CLICKHOUSE_MIGRATION_URL:               clickhouse://langfuse:langfuse@clickhouse:9000/langfuse
      CLICKHOUSE_URL:                         http://clickhouse:8123
      CLICKHOUSE_USER:                        langfuse
      CLICKHOUSE_PASSWORD:                    langfuse
      REDIS_HOST:                             redis
      REDIS_PORT:                             "6379"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET:        langfuse
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniopassword
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT:      http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_REGION:        us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET:        langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniopassword
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT:      http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_REGION:        us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_LOG_LEVEL:                     info
    networks:
      - ecommerce-network
    restart: unless-stopped

  # MinIO — S3-compatible object storage for LangFuse v3 event/media uploads
  minio:
    image: minio/minio:latest
    container_name: langfuse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     minio
      MINIO_ROOT_PASSWORD: miniopassword
    volumes:
      - minio_data:/data
    networks:
      - ecommerce-network
    restart: unless-stopped

  # Creates the "langfuse" bucket in MinIO on first run
  minio-init:
    image: minio/mc:latest
    container_name: langfuse-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        mc alias set local http://minio:9000 minio miniopassword;
        mc mb --ignore-existing local/langfuse;
        echo 'Bucket ready.';
      "
    networks:
      - ecommerce-network
    restart: on-failure

  langfuse-db:
    image: postgres:15-alpine
    container_name: langfuse-db
    environment:
      POSTGRES_DB:       langfuse
      POSTGRES_USER:     langfuse
      POSTGRES_PASSWORD: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    restart: unless-stopped

  # ClickHouse — analytical store for traces/observations
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: langfuse-clickhouse
    environment:
      CLICKHOUSE_DB:       langfuse
      CLICKHOUSE_USER:     langfuse
      CLICKHOUSE_PASSWORD: langfuse
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./monitoring/clickhouse-config.xml:/etc/clickhouse-server/config.d/cluster.xml
    networks:
      - ecommerce-network
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Redis — async queue between langfuse-server and langfuse-worker
  redis:
    image: redis:7-alpine
    container_name: langfuse-redis
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-network
    restart: unless-stopped

  # ==========================================
  # Prometheus — metrics collection
  # NOTE: For local dev, target is 172.17.0.1:8000
  # For production (FastAPI in Docker), change to fastapi:8000
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ecommerce-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ecommerce-network
    restart: unless-stopped

  # ==========================================
  # Grafana — dashboard
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: ecommerce-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - loki
    networks:
      - ecommerce-network
    restart: unless-stopped

  # ==========================================
  # Loki — log aggregation
  # ==========================================
  loki:
    image: grafana/loki:2.9.0
    container_name: ecommerce-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    user: "0"
    networks:
      - ecommerce-network
    restart: unless-stopped

  # ==========================================
  # Promtail — ships logs to Loki
  # ==========================================
  promtail:
    image: grafana/promtail:2.9.0
    container_name: ecommerce-promtail
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
      - ./logs:/logs
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - ecommerce-network
    restart: unless-stopped

# ==========================================
# VOLUMES
# ==========================================
volumes:
  postgres_data:
  langfuse_db_data:
  clickhouse_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:

# ==========================================
# NETWORKS
# ==========================================
networks:
  ecommerce-network:
    driver: bridge