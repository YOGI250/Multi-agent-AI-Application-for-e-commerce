name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY:   docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/ecommerce-agent

# ─────────────────────────────────────────────────────────────
# Stage 1 — Lint and Format Check
# ─────────────────────────────────────────────────────────────
jobs:
  lint:
    name: "Stage 1 — Lint & Format"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint dependencies
        run: pip install flake8==7.1.1 black==24.10.0

      - name: Run flake8
        run: |
          flake8 agents/ api/ services/ tools/ subgraphs/ langfuse_helpers/ \
                 database/ monitoring/ utils/ main.py \
                 --max-line-length=120 \
                 --extend-ignore=E501,W503,E203,E221,E251,E302,E303,W291,W293,E712,E701 \
                 --exclude=venv,__pycache__,.git,data,database/import_kaggle_data.py,database/classify_products.py

      - name: Run black --check
        run: |
          black --check --line-length=120 \
            agents/ api/ services/ tools/ subgraphs/ langfuse_helpers/ \
            database/ monitoring/ utils/ main.py


# ─────────────────────────────────────────────────────────────
# Stage 2 — Unit Tests + Coverage
# ─────────────────────────────────────────────────────────────
  test:
    name: "Stage 2 — Unit Tests (≥85% coverage)"
    runs-on: ubuntu-latest
    needs: lint

    env:
      GROQ_API_KEY:            test_groq_key
      DATABASE_URL:            postgresql://test:test@localhost:5432/test_db
      LANGFUSE_SECRET_KEY:     test_secret
      LANGFUSE_PUBLIC_KEY:     test_public
      LANGFUSE_HOST:           http://localhost:3000
      GOOGLE_CLIENT_ID:        test_client_id
      GOOGLE_CLIENT_SECRET:    test_client_secret
      POSTGRES_USER:           test
      POSTGRES_PASSWORD:       test
      POSTGRES_DB:             test_db
      GRAFANA_ADMIN_PASSWORD:  admin
      LANGFUSE_NEXTAUTH_SECRET: test_secret
      LANGFUSE_SALT:           test_salt

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest with coverage
        run: |
          pytest \
            --cov=. \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

# ─────────────────────────────────────────────────────────────
# Stage 3 — LLM Evaluation
# ─────────────────────────────────────────────────────────────
  evaluate:
    name: "Stage 3 — LLM Evaluation"
    runs-on: ubuntu-latest
    needs: test

    env:
      # Agent LLM calls are mocked — test key keeps CI deterministic and free
      GROQ_API_KEY:            test_groq_key
      DATABASE_URL:            postgresql://test:test@localhost:5432/test_db
      GOOGLE_CLIENT_ID:        test_client_id
      POSTGRES_USER:           test
      POSTGRES_PASSWORD:       test
      POSTGRES_DB:             test_db
      GRAFANA_ADMIN_PASSWORD:  admin
      LANGFUSE_NEXTAUTH_SECRET: test_secret
      LANGFUSE_SALT:           test_salt
      # Real LangFuse cloud credentials — eval results visible in UI after every push
      LANGFUSE_SECRET_KEY:     ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_PUBLIC_KEY:     ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_HOST:           https://cloud.langfuse.com
      # Set RUN_LIVE_EVAL=true in a scheduled workflow for live runs
      RUN_LIVE_EVAL:           "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-eval.txt

      - name: Seed LangFuse dataset (idempotent — skips if already exists)
        run: python eval/seed_dataset.py
        continue-on-error: true

      - name: Run LLM evaluation (mocked responses)
        run: python eval/run_eval.py

      - name: Upload evaluation reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: eval/reports/

# ─────────────────────────────────────────────────────────────
# Stage 4 — Docker Build
# ─────────────────────────────────────────────────────────────
  build:
    name: "Stage 4 — Docker Build"
    runs-on: ubuntu-latest
    needs: evaluate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ─────────────────────────────────────────────────────────────
# Stage 5 — Push to Registry (main branch only)
# ─────────────────────────────────────────────────────────────
  push:
    name: "Stage 5 — Push to Registry"
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ─────────────────────────────────────────────────────────────
# Stage 6 — Deploy to Kubernetes (main branch only)
# ─────────────────────────────────────────────────────────────
  deploy:
    name: "Stage 6 — Deploy to Kubernetes"
    runs-on: ubuntu-latest
    needs: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install k3d if missing
        run: |
          if ! command -v k3d &>/dev/null; then
            curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          fi
          k3d version

      - name: Start k3d cluster
        run: |
          k3d cluster create ecommerce \
            --servers 1 \
            --agents 1 \
            --wait
          k3d kubeconfig merge ecommerce --kubeconfig-switch-context

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Create namespace if missing
        run: kubectl create namespace ecommerce --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Kubernetes secrets
        run: |
          kubectl create secret generic ecommerce-secrets \
            --namespace=ecommerce \
            --from-literal=groq-api-key="${{ secrets.GROQ_API_KEY }}" \
            --from-literal=database-url="postgresql://ecommerce_user:${{ secrets.POSTGRES_PASSWORD }}@ecommerce-postgres:5432/ecommerce_db" \
            --from-literal=langfuse-encryption-key="${{ secrets.LANGFUSE_ENCRYPTION_KEY }}" \
            --from-literal=langfuse-secret-key="${{ secrets.LANGFUSE_SECRET_KEY }}" \
            --from-literal=langfuse-public-key="${{ secrets.LANGFUSE_PUBLIC_KEY }}" \
            --from-literal=langfuse-nextauth-secret="${{ secrets.LANGFUSE_NEXTAUTH_SECRET }}" \
            --from-literal=langfuse-salt="${{ secrets.LANGFUSE_SALT }}" \
            --from-literal=google-client-id="${{ secrets.GOOGLE_CLIENT_ID }}" \
            --from-literal=google-client-secret="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --from-literal=postgres-password="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl label secret ecommerce-secrets -n ecommerce \
            app.kubernetes.io/managed-by=Helm --overwrite
          kubectl annotate secret ecommerce-secrets -n ecommerce \
            meta.helm.sh/release-name=ecommerce \
            meta.helm.sh/release-namespace=ecommerce --overwrite

      - name: Pull and import images into k3d
        timeout-minutes: 8
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker pull postgres:17-alpine
          k3d image import ${{ env.IMAGE_NAME }}:${{ github.sha }} postgres:17-alpine --cluster ecommerce

      - name: Sync PostgreSQL password
        run: |
          kubectl wait pod -l component=postgres \
            --namespace=ecommerce --for=condition=Ready --timeout=30s 2>/dev/null || true
          kubectl exec -n ecommerce ecommerce-postgres-0 -- \
            psql -U ecommerce_user -d ecommerce_db \
            -c "ALTER USER ecommerce_user WITH PASSWORD '${{ secrets.POSTGRES_PASSWORD }}';" \
            2>/dev/null || true

      - name: Deploy with Helm
        id: helm_deploy
        run: |
          export PATH="$HOME/bin:$PATH"
          helm upgrade --install ecommerce ./helm \
            --namespace ecommerce \
            --values helm/values.yaml \
            --values helm/values-prod.yaml \
            --set image.repository=${{ env.IMAGE_NAME }} \
            --set image.tag=${{ github.sha }} \
            --set image.pullPolicy=IfNotPresent \
            --set replicaCount=1 \
            --set postgres.storageClass=local-path \
            --set langfuseDb.storageClass=local-path \
            --timeout=300s

      - name: Wait for PostgreSQL to be Ready
        run: |
          kubectl rollout status statefulset/ecommerce-postgres \
            --namespace=ecommerce \
            --timeout=240s

      - name: Smoke test — health check endpoint
        id: smoke_test
        timeout-minutes: 5
        run: |
          # Debug: show pod state before waiting
          echo "=== Pod status before wait ==="
          kubectl get pods -n ecommerce
          echo "=== FastAPI pod describe ==="
          kubectl describe pod -l component=fastapi -n ecommerce || true
          echo "=== FastAPI pod logs ==="
          kubectl logs -l component=fastapi -n ecommerce --tail=40 --previous 2>/dev/null || \
            kubectl logs -l component=fastapi -n ecommerce --tail=40 2>/dev/null || true

          # Wait for the fastapi pod to be Running before port-forwarding
          kubectl wait pod \
            -l component=fastapi \
            --namespace=ecommerce \
            --for=condition=Ready \
            --timeout=240s

          # Port-forward and poll /health
          kubectl port-forward svc/ecommerce-fastapi 8080:80 \
            --namespace=ecommerce &
          PF_PID=$!
          sleep 3
          HTTP_STATUS="000"
          for i in $(seq 1 20); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8080/health 2>/dev/null || echo "000")
            [ "$HTTP_STATUS" = "200" ] && break
            sleep 3
          done

          kill $PF_PID 2>/dev/null || true

          echo "Health check HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Smoke test FAILED — /health returned $HTTP_STATUS"
            exit 1
          fi
          echo "Smoke test PASSED"

      - name: Rollback on smoke-test failure
        if: failure() && steps.smoke_test.outcome == 'failure'
        run: |
          echo "Rolling back to previous Helm release..."
          helm rollback ecommerce --namespace=ecommerce || echo "No previous release to roll back to"
          echo "Rollback step complete"
