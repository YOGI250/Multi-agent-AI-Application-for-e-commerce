name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY:   docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/ecommerce-agent

# ─────────────────────────────────────────────────────────────
# Stage 1 — Lint and Format Check
# ─────────────────────────────────────────────────────────────
jobs:
  lint:
    name: "Stage 1 — Lint & Format"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint dependencies
        run: pip install flake8==7.1.1 black==24.10.0

      - name: Run flake8
        run: |
          flake8 agents/ api/ services/ tools/ subgraphs/ langfuse_helpers/ \
                 database/ monitoring/ utils/ main.py \
                 --max-line-length=120 \
                 --extend-ignore=E501,W503,E203,E221,E251,E302,E303,W291,W293,E712,E701 \
                 --exclude=venv,__pycache__,.git,data,database/import_kaggle_data.py,database/classify_products.py


# ─────────────────────────────────────────────────────────────
# Stage 2 — Unit Tests + Coverage
# ─────────────────────────────────────────────────────────────
  test:
    name: "Stage 2 — Unit Tests (≥70% coverage)"
    runs-on: ubuntu-latest
    needs: lint

    env:
      GROQ_API_KEY:            test_groq_key
      DATABASE_URL:            postgresql://test:test@localhost:5432/test_db
      LANGFUSE_SECRET_KEY:     test_secret
      LANGFUSE_PUBLIC_KEY:     test_public
      LANGFUSE_HOST:           http://localhost:3000
      GOOGLE_CLIENT_ID:        test_client_id
      GOOGLE_CLIENT_SECRET:    test_client_secret
      POSTGRES_USER:           test
      POSTGRES_PASSWORD:       test
      POSTGRES_DB:             test_db
      GRAFANA_ADMIN_PASSWORD:  admin
      LANGFUSE_NEXTAUTH_SECRET: test_secret
      LANGFUSE_SALT:           test_salt

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest with coverage
        run: |
          pytest \
            --cov=. \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

# ─────────────────────────────────────────────────────────────
# Stage 3 — LLM Evaluation
# ─────────────────────────────────────────────────────────────
  evaluate:
    name: "Stage 3 — LLM Evaluation"
    runs-on: ubuntu-latest
    needs: test

    env:
      GROQ_API_KEY:            test_groq_key
      DATABASE_URL:            postgresql://test:test@localhost:5432/test_db
      LANGFUSE_SECRET_KEY:     test_secret
      LANGFUSE_PUBLIC_KEY:     test_public
      LANGFUSE_HOST:           http://localhost:3000
      GOOGLE_CLIENT_ID:        test_client_id
      POSTGRES_USER:           test
      POSTGRES_PASSWORD:       test
      POSTGRES_DB:             test_db
      GRAFANA_ADMIN_PASSWORD:  admin
      LANGFUSE_NEXTAUTH_SECRET: test_secret
      LANGFUSE_SALT:           test_salt
      # Set RUN_LIVE_EVAL=true in a scheduled workflow for live runs
      RUN_LIVE_EVAL:           "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-eval.txt

      - name: Run LLM evaluation (mocked responses)
        run: python eval/run_eval.py

      - name: Upload evaluation reports
        uses: actions/upload-artifact@v4
        if: always()   # upload even on failure so reports are available for review
        with:
          name: eval-reports
          path: eval/reports/

# ─────────────────────────────────────────────────────────────
# Stage 4 — Docker Build
# ─────────────────────────────────────────────────────────────
  build:
    name: "Stage 4 — Docker Build"
    runs-on: ubuntu-latest
    needs: evaluate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ─────────────────────────────────────────────────────────────
# Stage 5 — Push to Registry (main branch only)
# ─────────────────────────────────────────────────────────────
  push:
    name: "Stage 5 — Push to Registry"
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ─────────────────────────────────────────────────────────────
# Stage 6 — Deploy to Kubernetes (main branch only)
# ─────────────────────────────────────────────────────────────
  deploy:
    name: "Stage 6 — Deploy to Kubernetes"
    runs-on: self-hosted
    needs: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Create namespace if missing
        run: kubectl create namespace ecommerce --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Kubernetes secrets
        run: |
          kubectl create secret generic ecommerce-secrets \
            --namespace=ecommerce \
            --from-literal=groq-api-key="${{ secrets.GROQ_API_KEY }}" \
            --from-literal=database-url="${{ secrets.DATABASE_URL }}" \
            --from-literal=langfuse-secret-key="${{ secrets.LANGFUSE_SECRET_KEY }}" \
            --from-literal=langfuse-public-key="${{ secrets.LANGFUSE_PUBLIC_KEY }}" \
            --from-literal=langfuse-nextauth-secret="${{ secrets.LANGFUSE_NEXTAUTH_SECRET }}" \
            --from-literal=langfuse-salt="${{ secrets.LANGFUSE_SALT }}" \
            --from-literal=google-client-id="${{ secrets.GOOGLE_CLIENT_ID }}" \
            --from-literal=postgres-password="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Load image into minikube
        run: |
          docker build -t ecommerce-agent:${{ github.sha }} .
          minikube image load ecommerce-agent:${{ github.sha }}

      - name: Deploy with Helm
        id: helm_deploy
        run: |
          export PATH="$HOME/bin:$PATH"
          helm upgrade --install ecommerce ./helm \
            --namespace ecommerce \
            --values helm/values.yaml \
            --values helm/values-prod.yaml \
            --set image.repository=ecommerce-agent \
            --set image.tag=${{ github.sha }} \
            --set image.pullPolicy=Never \
            --set replicaCount=1 \
            --timeout=300s

      - name: Smoke test — health check endpoint
        id: smoke_test
        run: |
          # Wait for deployment rollout (FastAPI waits for PG + seeds DB)
          kubectl rollout status deployment/ecommerce-fastapi \
            --namespace=ecommerce --timeout=300s

          # Port-forward and poll until /health responds
          kubectl port-forward svc/ecommerce-fastapi 8080:80 \
            --namespace=ecommerce &
          PF_PID=$!
          for i in $(seq 1 30); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8080/health 2>/dev/null || echo "000")
            [ "$HTTP_STATUS" = "200" ] && break
            sleep 3
          done

          kill $PF_PID 2>/dev/null || true

          echo "Health check HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Smoke test FAILED — /health returned $HTTP_STATUS"
            exit 1
          fi
          echo "Smoke test PASSED"

      - name: Rollback on smoke-test failure
        if: failure() && steps.smoke_test.outcome == 'failure'
        run: |
          echo "Rolling back to previous Helm release..."
          helm rollback ecommerce --namespace=ecommerce
          echo "Rollback complete"
